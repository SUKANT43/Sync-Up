services:
  backend:
    container_name: namviek-backend
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      args:
        - ENV_FILE=.env
    image: namviek
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis:6379
      - MONGODB_URL=mongodb://mongodb:27017/namviek?replicaSet=rs0&authSource=admin&directConnection=true
      - AWS_MINIO_ENDPOINT=http://storage:9000   # ✅ FIX (important)
    ports:
      - '3333:3000'
    command: /bin/sh -c "node ./main.js"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000"]   # ✅ FIXED port
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - mongodb
      - redis
    networks:
      - namviek-network

  frontend:
    container_name: namviek-frontend
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    env_file:
      - .env
    ports:
      - '3005:3000'
    command: /bin/sh -c 'HOSTNAME="0.0.0.0" node ./apps/frontend/server.js'
    depends_on:
      - backend
    networks:
      - namviek-network

volumes:
  mongodb-data:
  minio-data:
  mongodb-config:

networks:
  namviek-network:
    driver: bridge
